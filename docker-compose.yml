services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: event_booking
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the separate database used by the integration tests.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d event_booking"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Production-like container built from the Dockerfile.
  # Start with: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/event_booking
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
